- slug: cryptostream-pipeline
  name: "CryptoStream: Real-Time Crypto Data Pipeline"
  category: Data Engineering
  summary: >-
    A real-time pipeline for crypto market data. Prices flow from WebSocket
    into Kafka, then Spark Streaming, then Postgres, then dbt, then a FastAPI
    and React dashboard. Airflow runs the batch steps every five minutes.
  year: 2025
  stack:
    - Python
    - Kafka
    - Spark
    - Postgres
    - dbt
    - Airflow
    - FastAPI
    - React
    - Docker Compose
  impact: >-
    Builds 1-minute OHLCV candles and moving averages on a Bronze, Silver, and
    Gold medallion layout. The full stack runs in Docker Compose.
  github: https://github.com/Afran-zero/CryptoStream-real-time-crypto-analytics-pipeline
  case_study: true
  featured: true

