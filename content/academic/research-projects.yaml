- slug: benemo-bangla-multimodal
  title: "BENEMO: Bangla Multimodal Emotion Detection"
  question: >-
    Can a model that combines speech and text recognize emotion in Bangla
    conversations better than a text-only model?
  motivation: >-
    Bangla is a low-resource language for affective computing, and most prior
    work is text-only or English-first. Speech and text together are a natural
    next step.
  background: >-
    Early thesis work for CSE299 at North South University.
  method: >-
    An early hybrid pipeline. Speech features and Bangla text features are
    fused before classification.
  setup: >-
    Internal CSE299 setup on a Bangla acted-emotion dataset.
  results: >-
    Speech and text fusion beat the text-only baseline on the internal dataset.
  limitations: >-
    Small dataset, acted rather than spontaneous emotion, and no cross-corpus
    evaluation.
  future_work: >-
    Larger spontaneous-emotion corpora, cross-lingual transfer, and
    self-supervised speech features.
  repo_url: https://github.com/Afran-zero/BENEMO-BANGLA-MULTIMODAL-EMOTION-DETECTION-EARLY-HYBRID-APPROACH

- slug: knn-k-parameter-heuristics
  title: >-
    Heuristic and Dynamic Methods for Choosing K in K-Nearest Neighbors
  question: >-
    Do dynamic ways of choosing K beat fixed or heuristic choices for K-Nearest
    Neighbors classification?
  motivation: >-
    K-NN is sensitive to K. Most people pick K by rule of thumb, such as an odd
    number near the square root of N. Dynamic methods adjust K per query or per
    region.
  method: >-
    A comparison of heuristic K choices and dynamic K-selection methods on
    standard classification benchmarks.
  setup: >-
    Tabular classification benchmarks, with the same preprocessing and
    evaluation for every method.
  results: >-
    The comparison is complete. The full write-up is in the repository.
  limitations: >-
    Limited benchmark coverage, with no high-dimensional image or text
    benchmarks.
  future_work: >-
    Higher-dimensional and structured inputs, and learned distance metrics.
  repo_url: https://github.com/Afran-zero/Comparative-Analysis-of-Heuristic-and-Dynamic-Methods-for-Optimizing-the-K-Parameter

- slug: qml-as-qkd-entanglement-pathways
  title: QML as QKD in Entanglement Pathways
  question: >-
    Can quantum machine learning characterize the noise in BBM92 and E91
    quantum key distribution, and suggest protocol changes that help?
  motivation: >-
    E91 (Ekert, 1991) and BBM92 (Bennett, Brassard, and Mermin, 1992) are
    entanglement-based QKD protocols. Real hardware faces detector loss and
    channel noise, so the noise has to be understood before it can be reduced.
  background: >-
    E91 relies on Bell inequality violations and BBM92 relies on CHSH tests.
    Both fit one prepare-and-measure and entanglement-witness framework.
  method: >-
    Quantum machine learning to characterize noise types and propose
    protocol-level changes for BBM92 and E91.
  setup: >-
    Simulation with PennyLane and Qiskit. Hardware runs are a later step.
  results: >-
    In progress.
  limitations: >-
    Title not final. Simulator only so far.
  future_work: >-
    Hardware validation on QKD testbeds and integration with classical
    post-processing.

- slug: piqagat-quantum-adaptive-gat
  title: "Piqagat: Quantum Adaptive Graph Attention for Muon Regression"
  question: >-
    Can a quantum-adaptive Graph Attention Network improve muon regression
    compared with a classical GAT?
  motivation: >-
    Graph attention networks work well on graph-structured data. Quantum feature
    maps offer large implicit feature spaces. Combining the two is a natural
    thing to test on muon regression.
  background: >-
    Adaptive GAT layers with quantum feature maps at the node-embedding stage.
  method: >-
    A quantum-adaptive GAT, evaluated on muon regression against a classical GAT
    baseline.
  setup: >-
    Simulation with PennyLane and Qiskit.
  results: >-
    In progress.
  limitations: >-
    Simulator scale only. Noise robustness is not yet measured.
  future_work: >-
    Hardware runs, and ablations on the quantum encoding and graph structure.
