- slug: benemo-bangla-multimodal
  title: BENEMO — Bangla Multimodal Emotion Detection (Early Hybrid Approach)
  question: >-
    Can a hybrid speech + text model recognize emotions in Bangla
    conversation data more accurately than text-only baselines?
  motivation: >-
    Bangla is low-resource for affective computing; most prior work is
    text-only or English-centric. A speech + text fusion is a natural
    next step.
  background: >-
    Early thesis work for CSE299 at North South University. Combines
    Bangla speech features with text features for emotion classification.
  method: >-
    Hybrid early-fusion pipeline: speech features (e.g., MFCCs / wav2vec
    features) + Bangla text features (token / sub-word embeddings)
    fused before classification.
  setup: >-
    Internal CSE299 setup; Bangla conversational / acted emotion data;
    standard 80/10/10 splits.
  results: >-
    Speech + text fusion outperformed text-only on the internal acted-emotion
    dataset. Specific delta: [TBD: accuracy / weighted-F1 delta].
  limitations: >-
    Small dataset; acted rather than spontaneous emotion; no
    cross-corpus evaluation.
  future_work: >-
    Larger spontaneous-emotion corpora; cross-lingual transfer;
    self-supervised speech representations.
  repo_url: https://github.com/Afran-zero/BENEMO-BANGLA-MULTIMODAL-EMOTION-DETECTION-EARLY-HYBRID-APPROACH

- slug: knn-k-parameter-heuristics
  title: >-
    Comparative Analysis of Heuristic and Dynamic Methods for Optimizing
    the K Parameter in K-Nearest Neighbors
  question: >-
    Do dynamic K-selection strategies outperform fixed or heuristic K
    choices for K-Nearest Neighbors classification?
  motivation: >-
    K-NN performance is famously sensitive to K. Most practitioners pick
    K heuristically (odd integers around sqrt(N), etc.). Dynamic methods
    adjust K per query or per region.
  method: >-
    Comparative study of heuristic K choices vs. dynamic K-selection
    methods on a set of standard classification benchmarks.
  setup: >-
    Standard tabular classification benchmarks; identical preprocessing
    and evaluation harness across methods.
  results: >-
    Comparative analysis completed; full write-up in the repo.
    [TBD: best dynamic method's mean accuracy gain over fixed K].
  limitations: >-
    Limited benchmark coverage; no high-dimensional image / text
    benchmarks.
  future_work: >-
    Scale to higher-dimensional and structured inputs; integrate with
    learned distance metrics.
  repo_url: https://github.com/Afran-zero/Comparative-Analysis-of-Heuristic-and-Dynamic-Methods-for-Optimizing-the-K-Parameter

- slug: qml-as-qkd-entanglement-pathways
  title: QML as QKD in Entanglement Pathways
  question: >-
    Which noise types and protocol-level changes in BBM92 and E91 quantum
    key distribution can be characterized and improved using quantum
    machine learning?
  motivation: >-
    E91 (Ekert 1991) and BBM92 (Bennett, Brassard, Mermin 1992) are
    entanglement-based QKD protocols. Real-world implementations face
    detector inefficiencies, channel noise, and side-channel attacks.
    [TBD: specific noise characterization or key-rate gain QML targets].
  background: >-
    E91 relies on Bell-inequality violations; BBM92 on CHSH. Both can
    be expressed in the same prepare-and-measure + entanglement-witness
    framework. Ongoing work, title not yet fixed.
  method: >-
    Apply quantum machine learning techniques to characterize noise
    types and propose protocol-level changes on BBM92 and E91.
  setup: >-
    Theoretical + simulated analysis using PennyLane and Qiskit; later
    possible hardware runs.
  results: >-
    Work in progress.
  limitations: >-
    Title not fixed; simulator-only so far.
  future_work: >-
    Hardware validation on superconducting or photonic QKD testbeds;
    integration with classical post-processing.

- slug: piqagat-quantum-adaptive-gat
  title: Piqagat — Quantum Adaptive GAT for Muon Regression
  question: >-
    Can a quantum-adaptive Graph Attention Network improve muon
    transverse-momentum regression compared with classical GAT?
  motivation: >-
    GATs are strong on structured / graph data; quantum feature maps
    offer exponentially large implicit feature spaces. Combining both
    is a natural exploration for muon regression tasks.
  background: >-
    Quantum-adaptive graph attention — adaptive GAT layers with quantum
    feature maps at the node-embedding stage.
  method: >-
    Quantum-adaptive GAT architecture. Evaluation on muon regression
    benchmarks.
  setup: >-
    PennyLane / Qiskit-based simulation; classical GAT baseline for
    comparison.
  results: >-
    Work in progress.
  limitations: >-
    Simulator scale; noise robustness not yet characterized.
  future_work: >-
    Hardware runs; ablations on quantum-encoding choice and graph
    topology.