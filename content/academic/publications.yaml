- id: persona-multiplicity-moral
  title: >-
    Persona Multiplicity and Deliberative Synthesis in a Single Large
    Language Model: A Stochastic Multi-Agent Study of Moral Game-Theoretic
    Choice
  authors:
    - M. K. A. Khan
  venue: Thesis (not published)
  year: 2026
  status: Preprint
  abstract: >-
    A multi-persona moral reasoning framework that generates dynamic
    personas, performs independent reasoning, and aggregates via a
    deliberative synthesis (not simple voting). Metrics: moral conflict
    score, consensus strength, stakeholder / principle coverage.
    Outperforms single-shot baselines on stakeholder and consequence
    coverage.

