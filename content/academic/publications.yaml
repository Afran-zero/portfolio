# ---------- Published (2026) ----------

- id: gdp-arima-ml-2026
  title: >-
    Explainable Hybrid ARIMA and ML Forecasting of Bangladesh's GDP: Sectoral
    Energy Consumption and Carbon Emission Dynamics
  authors:
    - M. K. A. Khan
  venue: 5th IEEE International Conference on Robotics, Automation, Artificial Intelligence and Internet of Things (RAAICON 2026)
  year: 2026
  status: Published
  abstract: >-
    A hybrid residual learning ensemble. ARIMA handles the trend, and XGBoost,
    Random Forest, GBM, and SVR model the residuals, with SHAP for
    explainability. It reached a best MAPE of 7.60% and beat both ARIMA and the
    standalone ML baselines.

- id: fsm-lora-2026
  title: >-
    FSM-LoRA: Dynamic Gradient Gating via Finite State Machines for
    Energy-Efficient LoRA Fine-Tuning
  authors:
    - M. K. A. Khan
  venue: IEEE 2nd International Conference on AI and Emerging Technology for Sustainable Future (ICAISF 2026)
  year: 2026
  status: Published
  abstract: >-
    A finite state machine decides when to skip redundant backward passes
    during LoRA fine-tuning. It skips 15 to 58% of backward passes and cuts
    wall-clock time by up to 58.58%, with accuracy within 0.5% of standard
    LoRA. Tested on Phi-2, Qwen2.5-3B, and OpenLLaMA-3B.

