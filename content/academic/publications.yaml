- id: iccit-llm-vs-ml-2026
  title: >-
    Benchmarking Large Language Models Against Classical Machine Learning for
    Undergraduate Academic Performance Prediction
  authors:
    - M. K. A. Khan
  venue: 29th International Conference on Computer and Information Technology (ICCIT 2026)
  year: 2026
  status: Under Review
  abstract: >-
    Seven classical ML models and five LLMs were tested on 872 student records,
    using zero-shot, few-shot, and LoRA setups. Extra Trees reached 88.57%
    accuracy, and the best fine-tuned LLM, Gemma-2-9B-IT, reached 56.57%.

- id: persona-multiplicity-moral
  title: >-
    Persona Multiplicity and Deliberative Synthesis in a Single Large
    Language Model: A Stochastic Multi-Agent Study of Moral Game-Theoretic
    Choice
  authors:
    - M. K. A. Khan
  venue: Thesis (not published)
  year: 2026
  status: Preprint
  abstract: >-
    One LLM plays several moral personas, reasons through each one, and then
    combines the answers through deliberative synthesis instead of a vote.
    It covers more stakeholders and consequences than a single-shot baseline.

