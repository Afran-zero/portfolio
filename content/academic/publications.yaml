# ---------- Published (2026) ----------

- id: fsm-lora-2026
  title: >-
    FSM-LoRA: Dynamic Gradient Gating via Finite State Machines for
    Energy-Efficient LoRA Fine-Tuning
  authors:
    - M. K. A. Khan
  venue: IEEE 2nd International Conference on AI and Emerging Technology for Sustainable Future (ICAISF 2026)
  year: 2026
  status: Published
  abstract: >-
    A Finite State Machine controller dynamically skips redundant backward
    passes during LoRA fine-tuning. Skipped 15–58% of backward passes,
    up to 58.58% wall-clock time reduction, accuracy within ±0.5% of
    standard LoRA. Evaluated on Phi-2, Qwen2.5-3B, and OpenLLaMA-3B.

