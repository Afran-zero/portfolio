title: >-
  Persona Multiplicity and Deliberative Synthesis in a Single Large
  Language Model: A Stochastic Multi-Agent Study of Moral Game-Theoretic
  Choice
abstract: >-
  Asks whether a single LLM can simulate multiple moral personas and
  produce better-reasoned answers to game-theoretic moral dilemmas than a
  single-shot baseline. The framework generates dynamic personas, runs
  independent reasoning per persona, and aggregates via deliberative
  synthesis (not simple voting). Metrics: moral conflict score,
  consensus strength, stakeholder / principle coverage. Multi-persona
  synthesis outperforms single-shot baselines on stakeholder and
  consequence coverage.
status: Thesis (in preparation; not published)

