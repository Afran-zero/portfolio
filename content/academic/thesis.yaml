title: >-
  Persona Multiplicity and Deliberative Synthesis in a Single Large
  Language Model: A Stochastic Multi-Agent Study of Moral Game-Theoretic
  Choice
abstract: >-
  Can one LLM play several moral personas and reach better answers to
  game-theoretic dilemmas than a single-shot baseline? The framework creates
  dynamic personas, reasons through each one, and combines the results through
  deliberative synthesis instead of voting. It is measured by moral conflict,
  consensus strength, and how well it covers stakeholders and principles. The
  multi-persona setup covers more stakeholders and consequences than the
  single-shot baseline.
status: In preparation, not yet published

